default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('DATABASE_HOST', '') %>
  username: <%= ENV.fetch('DATABASE_USERNAME', '') %>
  password: <%= ENV.fetch('DATABASE_PASSWORD', '') %>
  max_connections: 5

development:
  <<: *default
  database: myapp_development

test:
  <<: *default
  database: myapp_test
